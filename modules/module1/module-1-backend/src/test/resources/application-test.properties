# ── Test Profile (uses H2 in-memory) ─────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cnc_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# Disable Flyway in tests (schema managed by Hibernate)
spring.flyway.enabled=false

# Disable Redis in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Disable ML service and simulator
cnc.ml-service.enabled=false
cnc.simulator.enabled=false

logging.level.com.cncsmartcore=DEBUG
logging.level.org.springframework.test=DEBUG
