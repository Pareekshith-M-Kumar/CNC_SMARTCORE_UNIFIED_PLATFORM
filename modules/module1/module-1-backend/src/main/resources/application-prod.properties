# ── Production Profile ────────────────────────────────────────────────────────
# All sensitive values are injected at runtime via environment variables.
# Never commit actual credentials here.

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.cncsmartcore=WARN
logging.level.org.springframework=WARN
logging.level.root=ERROR

# ── ML Service ────────────────────────────────────────────────────────────────
cnc.ml-service.enabled=true
cnc.ml-service.base-url=${ML_SERVICE_URL}
cnc.ml-service.api-key=${ML_SERVICE_API_KEY:}
cnc.ml-service.timeout-seconds=10

# ── Simulator (disabled in production) ───────────────────────────────────────
cnc.simulator.enabled=false

# ── Actuator (restrict in production) ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
