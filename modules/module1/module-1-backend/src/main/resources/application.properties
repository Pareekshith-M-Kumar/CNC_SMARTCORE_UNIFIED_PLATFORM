# ── Application ─────────────────────────────────────────────────────────────
spring.application.name=cnc-smartcore-monitoring
server.port=${PORT:8082}
server.servlet.context-path=/api

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=m1

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ── Security & Supabase JWT ──────────────────────────────────────────────────
cnc.security.enabled=${CNC_SECURITY_ENABLED:true}
cnc.cors.allowed-origins=${CNC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://tlqdmyzpooiadaqnzowc.supabase.co/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:https://tlqdmyzpooiadaqnzowc.supabase.co/auth/v1}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.cncsmartcore=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── CNC ML Service ───────────────────────────────────────────────────────────
cnc.ml-service.base-url=${CNC_ML_SERVICE_URL:http://localhost:8001}
cnc.ml-service.enabled=false
cnc.ml-service.timeout-seconds=5
cnc.ml-service.connect-timeout-ms=3000
cnc.ml-service.read-timeout-seconds=10

# ── Predictive Maintenance ────────────────────────────────────────────────────
cnc.maintenance.prediction.interval-ms=3600000

# ── Simulator (override per profile) ─────────────────────────────────────────
cnc.simulator.enabled=true
cnc.simulator.interval-ms=10000

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cnc_smartcore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cnc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.show-sql=false

#Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}