# ── Dev Profile (Supabase DB) ─────────────────────────────────────────────────
spring.profiles.active=dev

# ── PostgreSQL (Supabase) ─────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cnc_smartcore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cnc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Redis (local) ─────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.cncsmartcore=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ── Simulator ─────────────────────────────────────────────────────────────────
cnc.simulator.enabled=true
cnc.simulator.interval-ms=5000

# ── ML Service (disabled locally) ─────────────────────────────────────────────
cnc.ml-service.enabled=false
cnc.ml-service.base-url=http://localhost:8000