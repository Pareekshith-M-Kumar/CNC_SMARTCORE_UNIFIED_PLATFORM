server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cnc-smartcore-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    jwks-url: ${SUPABASE_JWKS_URL:https://dummy-project.supabase.co/auth/v1/.well-known/jwks.json}
    issuer: ${SUPABASE_JWT_ISSUER:https://dummy-project.supabase.co/auth/v1}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
    secret: ${SUPABASE_JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  geometry-service:
    url: ${GEOMETRY_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${INTERNAL_API_KEY:local-dev-internal-key-change-in-production}
  storage:
    bucket-originals: ${STORAGE_BUCKET_ORIGINALS:cad-originals}
    bucket-previews: ${STORAGE_BUCKET_PREVIEWS:cad-previews}
    bucket-toolpaths: ${STORAGE_BUCKET_TOOLPATHS:toolpaths}
    bucket-reports: ${STORAGE_BUCKET_REPORTS:reports}
    signed-url-ttl-seconds: ${SIGNED_URL_TTL_SECONDS:300}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:52428800}
  manufacturing:
    energy-tariff-per-kwh: ${ENERGY_TARIFF_PER_KWH:8.0}
    currency-code: ${CURRENCY_CODE:INR}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./storage-data/localdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

